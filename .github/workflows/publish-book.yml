name: Publish book

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  queue: max

permissions: {}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/check-book.yml
    with:
      upload_book: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the checked book
        id: deployment
        uses: actions/deploy-pages@v5
