name: Check book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      upload_book:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install C++ build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libc++-dev libc++abi-dev
      - name: Build with the pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
      - name: Run the model checks
        run: sh scripts/check.sh
      - name: Render the book
        run: lake exe generate-book --output "$RUNNER_TEMP/book"
      - name: Scan the rendered book for secrets
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir --redact=100 --no-banner book/html-single
      - name: Upload the checked book for publication
        if: inputs.upload_book
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/book/html-single
